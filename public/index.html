<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Order Book</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Order Book</h1>

    <!-- Place order form -->
    <div class="order-form">
        <label>Side
            <select id="side">
                <option value="buy">Buy</option>
                <option value="sell">Sell</option>
            </select>
        </label>
        <label>Price <input type="number" id="price" step="0.01" value="100"></label>
        <label>Size  <input type="number" id="size"  step="0.0001" value="1"></label>
        <button id="place">Place Order</button>
    </div>

    <!-- Book display -->
    <div class="book">
        <table>
            <thead>
                    <tr>
                        <th>Bid</th>
                        <th>Size</th>
                        <th>Ask</th>
                        <th>Size</th>
                    </tr>
            </thead>

            <tbody id="bids"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
